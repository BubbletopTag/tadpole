# Tadpole device profile — Didj (LF1000)
#
# INSTALLABLE, NOT YET BOOTABLE, and the gap between those is one assertion.
# Everything below is read out of the firmware rather than copied from the
# LeapPad2. Online System Update fetches this device and installs it like any
# other now — pkgtool reads the JFFS2 root filesystem and install-firmware.py
# lays out the /Didj tree — and its own AppManager starts under qemu and dies
# on a cartridge read. See docs/DIDJ.md.
#
# The Didj is a 2008 handheld on LF1000 silicon — older than every other device
# in this directory, and the only one whose packages LeapFrog never published an
# LFConnect XML for. tools/packagelists/Didj.xml is transcribed from a
# community-supplied inventory instead.
#
# NOT TO BE CONFUSED WITH "Didj support" IN THE WIZARD. That step installs a
# compatibility layer — built by a member of the LFHacks community, not by
# LeapFrog — which lets Didj GAMES run on LeapPad2 firmware. This profile is the
# opposite thing: the Didj's own firmware, to be run as itself.

DEV_ID=didj
DEV_NAME="Didj"
DEV_LONGNAME="LeapFrog Didj"

# VERIFIED. firmware-LF_LF1000/meta.inf in DIDJ-0x000E0003-000001.lfp says
# Device="Didj", Version="1.35.2.4222", 22 April 2009. tad_detect_device()
# matches on this.
DEV_META_DEVICE=Didj

# VERIFIED: all eight boot screens in var/screens are 320x240, landscape. No
# touchscreen — the Didj is a d-pad and buttons device, a shape nothing else in
# this directory has.
DEV_LCD=320x240
DEV_UI_ROTATE=0

# WHICH INPUT DEVICES IT HAS, which the shim answers EVIOCGNAME with. Brio
# hunts for its keyboard by name and asserts when no node claims it. Read out
# of this device's own kernel — kernel.bin holds a gzip'd Linux 2.6.20.1 whose
# rodata carries the driver's name and phys adjacent:
#     LF1000 Keyboard\0lf1000/input0\0
# Unset means the LF2000 set, which is what every other device here uses.
DEV_EVDEV=lf1000

DEV_HAS_QT=0       # far predates the Qt shell
DEV_HAS_WIFI=0     # no radio of any kind

# The CDN layout, which is the part that IS verified. Packages live flat under
# packages/DIDJ/ as .lfp rather than under packages/<middle>/ as .lf2, and
# fetch-firmware.py already tries lfp when a device directory is set, so no
# code change was needed to reach them. All thirteen download and install.
DEV_FW_DIR=DIDJ
DEV_FW_PKG=DIDJ-0x000E0003-000001
DEV_PKGLIST=Didj.xml

# ---- how it boots, read out of the extracted firmware ---------------------
#
# THE TREE ROOT IS /Didj, NOT /LF, and that is the structural difference that
# matters. Every other device Tadpole runs lays its system out under /LF/Base;
# the Didj uses /Didj/Base, and cartridges mount at /Cart/Base. Anything in the
# emulator that hardcodes /LF will need to learn this.
#
# The boot chain: rcS sources /etc/profile, runs /etc/rc.d/S*, and
# /etc/init.d/lightning starts /usr/bin/launch_main, which is a shell script
# whose DEFAULT_MAIN_APP is AppManager. So the Didj runs AppManager exactly as
# the LeapPad2 and the Leapster GS do — it is a Brio device, and the Brio
# package carries the same MPI set (libModuleMPI, libVideoMPI, libAudioMPI,
# libEventMPI, libPowerMPI, libUSBDeviceMPI).
#
# AppManager is 22471 bytes in DIDJ-0x000E000A-000001.lfp as bin/AppManager,
# which installs to /Didj/Base/bin/.
DEV_SHELL=/Didj/Base/bin/AppManager
DEV_SHELL_ARGS=""
DEV_FIRST_APP=

# Transcribed from the firmware's own /etc/profile, which sets exactly these
# two and nothing else. The /Cart paths are for a cartridge and are harmless
# when none is mounted.
DEV_ENV="PATH=/Cart/Base/Brio/bin:/Didj/Base/Brio/bin/:/Didj/Base/bin/:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"

# THE LIBRARY PATH IS NOT IN DEV_ENV, and that is deliberate. /etc/profile does
# set it — the line is
#     LD_LIBRARY_PATH=/Didj/Base/Brio/lib/:/Didj/Base/lib/:/usr/local/lib
# — but tadpole.sh owns that variable: it is where the shim directories go, and
# a device profile setting it again simply won directly, leaving the guest with
#     AppManager: can't load library 'libdl.so.9'
# because the shim was no longer anywhere it could be found. So the device's own
# directories are declared here and tadpole.sh splices them into the middle of
# its own path: shims first, then these, then the flattened runtime/libs.
DEV_GUEST_LIBS="/Didj/Base/Brio/lib:/Didj/Base/lib:/usr/local/lib"

# ONE LIBRARY FOR BOTH GL APIS, so runtime/shimlibs-gl must stay OFF the path.
# The LF2000 devices load libEGL.so.1 and libGLESv1_CM.so.1 from there; this
# device wants a single libopengles_lite.so, which tools/install-firmware.py
# puts into its own /Didj/Base/Brio/lib. Having both would put two EGLs in one
# process, which is the hazard the shimlibs-egl notes in tadpole.sh describe.
DEV_GL_COMBINED=1

# WHICH PLANE THE GL SURFACE IS: layer0, and this device is the only one that
# says so. Every LF2000 device puts its 3D surface on fb1, which is what the
# shim's rasteriser, the host replayer and the viewer's compositor all assumed
# until this line existed.
#
# Read out of the MLC ioctl trace of AppManager booting (TADPOLE_DEBUG=1):
# libDisplay configures exactly one RGB layer —
#
#     layer0: format 4, hstride 1280, address 0, enable 1
#
# — asks layer1 only for its address, and sets layer2 up as the YUV plane
# (format 1, hstride 4096, address 0x20000000) for the boot movie. The OpenGL
# context renders into layer0's buffer; there is no other RGB plane it could
# be on. The software rasteriser had been landing on those bytes by accident,
# because every plane aliases arena offset 0 here; the host replayer, told
# the GL plane was fb1, presented its frames into a page the Didj never
# enables, and the copyright screen stayed up for the whole session while the
# menus were drawn, correctly, somewhere nobody looked.
DEV_GL_LAYER=0

# THE D-PAD IS WIRED THE WAY IT LOOKS. The viewer turns the arrow keys a
# quarter turn for every LF2000 device (DPAD_GAME_TURN in tadpole_view.c:
# their titles' axes sit a quarter turn from the gpio-keys codes, measured on
# the LeapPad2 and again on the LeapPad3). This device's libEvent maps the
# LF1000 Keyboard's codes straight to kButtonUp/Down/Left/Right, and with the
# LeapPad turn applied the owner measured, at ROT 0 in the home menu:
#
#     visual LEFT   ->  the menu moves DOWN
#     visual RIGHT  ->  the menu moves UP
#
# — the LeapPad correction, applied where none is needed. Zero here means the
# arrows go out as the directions they show. Unset means 3, the LF2000 turn.
DEV_DPAD_TURN=0

# WHICH ENGINE, and this is the one device that names one.
#
# Under glasspole the Didj reaches its copyright screen and stops there — no
# assert, no crash, and not one GL draw call, where the same binaries under
# qemu-arm go on to the country picker. Two syscalls it asks for are still
# missing (36 sync, 149 _sysctl) but both are harmless and qemu refuses them
# too, so that is not it. Unfound, so: run what works, say why here, and leave
# TADPOLE_QEMU able to override for whoever goes looking.
DEV_ENGINE=qemu

# HOST-GPU REPLAY WORKS HERE NOW, and the profile no longer asks for the
# software rasteriser. It did, for months, because replay "froze the Didj on
# its copyright screen": two minutes of identical frames, 24 draws each, no
# GL error and no progress. The guest was never stopped. Three things were
# wrong at once, and every one of them looked like that from the window:
#
#   1. The replayed frame was presented into fb1's page, which this device
#      never enables — DEV_GL_LAYER above. The copyright screen on fb0 stayed
#      up while the menus drew, correctly, into a page nobody composited.
#   2. The host's resync — which the Didj triggers on every boot, because its
#      UI binds five texture names it never uploads — dropped the host's
#      array table and nothing rebuilt it; and the per-draw path skipped any
#      VBO array at offset 0 as "unset". Every draw after the first resync
#      was dropped as "no vertex array". (tadpole_gles_core.c, hle_send_array
#      and hle_sync_arrays.)
#   3. That same resync re-uploaded every texture without its filters, and a
#      texture with the default minification filter and no mipmaps is
#      incomplete on desktop GL — sampled as untextured white. So once the
#      draws did land, the frame was a white screen. (hle_sync_state.)
#
# Measured after the fix: AppManager's home screen, the country picker and a
# title all render under replay at the panel's 60 fps, from a window
# screenshot rather than the ring's statistics.
#
# TADPOLE_GL_SOFTWARE=1 still forces the software rasteriser, for telling a
# fault in the shared GL core from one in the replay. The five never-uploaded
# textures draw white on both paths and are a separate, open bug.

# NOT YET KNOWN, and left out rather than guessed: DEV_UIPKG, DEV_SPLASH,
# DEV_SOUNDS, DEV_CODEC and the DEV_*_DEV node names. The firmware extracts
# cleanly now, so these are readable rather than speculative — they simply have
# not been read yet.
