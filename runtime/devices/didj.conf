# Tadpole device profile — Didj (LF1000)
#
# NOT YET A BOOT PROFILE, but no longer guesswork. The firmware has been
# downloaded and extracted, and everything below is read out of it rather than
# copied from the LeapPad2. Nothing here has RUN a Didj yet: the rootfs is
# JFFS2 rather than a tarball, so there is no install path into a sysroot yet,
# and that is the next piece of work rather than a missing field.
#
# The Didj is a 2008 handheld on LF1000 silicon — older than every other device
# in this directory, and the only one whose packages LeapFrog never published an
# LFConnect XML for. tools/packagelists/Didj.xml is transcribed from a
# community-supplied inventory instead.
#
# NOT TO BE CONFUSED WITH "Didj support" IN THE WIZARD. That step installs a
# compatibility layer — built by a member of the LFHacks community, not by
# LeapFrog — which lets Didj GAMES run on LeapPad2 firmware. This profile is the
# opposite thing: the Didj's own firmware, to be run as itself.

DEV_ID=didj
DEV_NAME="Didj"
DEV_LONGNAME="LeapFrog Didj"

# VERIFIED. firmware-LF_LF1000/meta.inf in DIDJ-0x000E0003-000001.lfp says
# Device="Didj", Version="1.35.2.4222", 22 April 2009. tad_detect_device()
# matches on this.
DEV_META_DEVICE=Didj

# VERIFIED: all eight boot screens in var/screens are 320x240, landscape. No
# touchscreen — the Didj is a d-pad and buttons device, a shape nothing else in
# this directory has.
DEV_LCD=320x240
DEV_UI_ROTATE=0

DEV_HAS_QT=0       # far predates the Qt shell
DEV_HAS_WIFI=0     # no radio of any kind

# The CDN layout, which is the part that IS verified. Packages live flat under
# packages/DIDJ/ as .lfp rather than under packages/<middle>/ as .lf2, and
# fetch-firmware.py already tries lfp when a device directory is set, so no
# code change was needed to reach them.
DEV_FW_DIR=DIDJ
DEV_FW_PKG=DIDJ-0x000E0003-000001
DEV_PKGLIST=Didj.xml

# ---- how it boots, read out of the extracted firmware ---------------------
#
# THE TREE ROOT IS /Didj, NOT /LF, and that is the structural difference that
# matters. Every other device Tadpole runs lays its system out under /LF/Base;
# the Didj uses /Didj/Base, and cartridges mount at /Cart/Base. Anything in the
# emulator that hardcodes /LF will need to learn this.
#
# The boot chain: rcS sources /etc/profile, runs /etc/rc.d/S*, and
# /etc/init.d/lightning starts /usr/bin/launch_main, which is a shell script
# whose DEFAULT_MAIN_APP is AppManager. So the Didj runs AppManager exactly as
# the LeapPad2 and the Leapster GS do — it is a Brio device, and the Brio
# package carries the same MPI set (libModuleMPI, libVideoMPI, libAudioMPI,
# libEventMPI, libPowerMPI, libUSBDeviceMPI).
#
# AppManager is 22471 bytes in DIDJ-0x000E000A-000001.lfp as bin/AppManager,
# which installs to /Didj/Base/bin/.
DEV_SHELL=/Didj/Base/bin/AppManager
DEV_SHELL_ARGS=""
DEV_FIRST_APP=

# Transcribed from the firmware's own /etc/profile, which sets exactly these
# two and nothing else. The /Cart paths are for a cartridge and are harmless
# when none is mounted.
DEV_ENV="PATH=/Cart/Base/Brio/bin:/Didj/Base/Brio/bin/:/Didj/Base/bin/:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
LD_LIBRARY_PATH=/Didj/Base/Brio/lib/:/Didj/Base/lib/:/usr/local/lib"

# NOT YET KNOWN, and left out rather than guessed: DEV_UIPKG, DEV_SPLASH,
# DEV_SOUNDS, DEV_CODEC and the DEV_*_DEV node names. The firmware extracts
# cleanly now, so these are readable rather than speculative — they simply have
# not been read yet.
