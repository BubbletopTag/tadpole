# Tadpole device profile — Didj (LF1000)
#
# A FETCH PROFILE, NOT YET A BOOT PROFILE. This is enough for
# tools/fetch-firmware.py to find and download the Didj's packages, and it is
# NOT enough to boot one. Nothing here has run a Didj. The fields below that
# would decide how a guest starts are marked UNVERIFIED and are guesses shaped
# by the LeapPad2 profile, which is a different generation of hardware.
#
# The Didj is a 2008 handheld on LF1000 silicon — older than every other device
# in this directory, and the only one whose packages LeapFrog never published an
# LFConnect XML for. tools/packagelists/Didj.xml is transcribed from a
# community-supplied inventory instead.
#
# NOT TO BE CONFUSED WITH "Didj support" IN THE WIZARD. That step installs a
# compatibility layer — built by a member of the LFHacks community, not by
# LeapFrog — which lets Didj GAMES run on LeapPad2 firmware. This profile is the
# opposite thing: the Didj's own firmware, to be run as itself.

DEV_ID=didj
DEV_NAME="Didj"
DEV_LONGNAME="LeapFrog Didj"

# UNVERIFIED — no Didj firmware has been unpacked here, so the Device= string in
# its Firmware/meta.inf has not been read. tad_detect_device() matches on this,
# so it is the first thing to correct once a firmware is actually extracted.
DEV_META_DEVICE=Didj

# The Didj's panel. 320x240, landscape, no touchscreen — it is a d-pad and
# buttons device, which is a shape nothing else in this directory has.
DEV_LCD=320x240
DEV_UI_ROTATE=0

DEV_HAS_QT=0       # far predates the Qt shell
DEV_HAS_WIFI=0     # no radio of any kind

# The CDN layout, which is the part that IS verified. Packages live flat under
# packages/DIDJ/ as .lfp rather than under packages/<middle>/ as .lf2, and
# fetch-firmware.py already tries lfp when a device directory is set, so no
# code change was needed to reach them.
DEV_FW_DIR=DIDJ
DEV_FW_PKG=DIDJ-0x000E0003-000001
DEV_PKGLIST=Didj.xml

# UNVERIFIED, ALL OF IT. Everything below decides how a guest boots and none of
# it has been checked against a real Didj image. Left blank rather than filled
# with LeapPad2 values, because a wrong shell path fails in a way that looks
# like an emulator bug rather than a missing profile.
DEV_SHELL=
DEV_SHELL_ARGS=""
DEV_FIRST_APP=
DEV_ENV=""
