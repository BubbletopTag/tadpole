# Tadpole device profile — LeapPad3 (CABO)
#
# Firmware 6.2.0.654, built 03/22/2016 — the last LeapPad3 build LeapFrog
# shipped, and three years newer than the Ultra's.
#
# THE LEAPPAD3 IS NOT THE "LEAPPAD 3" THE CDN MEANS. LeapFrog counted the
# LeapPad Ultra as its third LeapPad, so the Ultra's firmware directory is
# `PAD3FW` and its packages are `PHR1-*`. The retail LeapPad3 that came after
# it is `PAD3-*`, and its firmware is not under any device directory at all —
# see DEV_FW_DIR below.
#
# Relative to the Ultra this device is the SAME shell on a SMALLER screen:
# AppServer/Qt 4.8.4 QWS, same -qws launch, same libEGL injection vector, same
# package-manager daemon over D-Bus — but the LeapPad2's 480x272 panel. So the
# Ultra's four Qt fixes all apply unchanged, and the two geometry bugs that
# only showed up at 1024x600 cannot bite here.
#
# Values marked UNVERIFIED were inferred from the firmware rather than read off
# hardware. See docs/LEAPPAD3.md for how each was derived.

DEV_ID=leappad3
DEV_NAME="LeapPad3"
DEV_LONGNAME="LeapFrog LeapPad3"

# Firmware/meta.inf says Device="LeapPad3" — NOT "LeapPad3Explorer", which is
# what LFConnect's package list calls the same machine. Autodetect matches the
# firmware's spelling, because that is the file that is actually installed.
DEV_META_DEVICE=LeapPad3

# ---- sysfs identity -------------------------------------------------------
# CABO, from the device's own script: usr/bin/recovery-dftp branches on
#     elif [ "$PLATFORM" == "CABO" ]; then
# in the same if-chain as the Ultra's RIO case. Nothing in this firmware's rcS
# branches on platform_family at all — it only logs `platform` — so unlike the
# LeapPad2 and the Ultra there is no second name to get right.
DEV_PLATFORM=CABO
DEV_PLATFORM_FAMILY=CABO                                # UNVERIFIED
DEV_SYSTEM_REV=0x320                                    # UNVERIFIED
# 480x272 — the LeapPad2 panel, not the Ultra's. Established four ways over:
# every boot asset in /var/screens is 480x272 (cabo_boot_logo.png,
# BrokenScreen.png, the cabo-sparkle frames), and one of them says the size in
# its own filename: cabo_boot_battery_low_480_272.png.
DEV_LCD=480x272
DEV_LCD_TYPE=UNKNOWN                                    # UNVERIFIED
# NOT decoration on this device. /etc/init.d/touchscreen-cabo reads lcd_mfg and
# maps it to a touch driver — "SDS-1" -> pap11xx_ts, "K&D-1" -> icn85xx_ts,
# "NVD-1" -> tu_drvs — and anything else makes it probe i2c bus 2, which does
# not exist here. Tadpole never runs that script (the shim supplies evdev
# directly), so this only has to be a value the script would accept.
DEV_LCD_MFG="K&D-1"                                     # UNVERIFIED

# rcS still writes lf2000-aclmtr and the power driver keeps its lf2000 name on
# this board too, three SoC generations on. Same names as the Ultra.
DEV_GPIO_DEV=lf1000-gpio
DEV_DPC_DEV=lf1000-dpc
DEV_POWER_DEV=lf2000-power
DEV_ACLMTR_DEV=lf2000-aclmtr
DEV_TOUCH_DEV=lf2000-touchscreen

# ---- shell ----------------------------------------------------------------
# /usr/bin/app runs, exactly as the Ultra's does:
#     nice -n $niceLevel AppServer $appPath $2 -qws
#
# THE MODULE PATH, NOT /LF/Base/Qt/bin/AppServer — that name is a symlink to
# the ABSOLUTE GUEST PATH /LF/Base/Qt/Modules/AppServer/AppServer, which is
# correct on the device and unresolvable on the host. Following it produces no
# error at all; the shell simply never starts.
DEV_SHELL=/LF/Base/Qt/Modules/AppServer/AppServer
DEV_SHELL_ARGS="-qws"
# /usr/bin/app takes this from $RIO_FIRST_APP, and NOTHING IN THIS FIRMWARE
# SETS IT — the only mention of the name in the whole rootfs is the line that
# reads it. AppServer's own BaseAppPaths.json is the empty placeholder ("this
# empty one will work for Cabo, Xanadu, Bogota ..."), so the first app has to
# be named on the command line, as it is here.
DEV_FIRST_APP=
DEV_ASSETS=Qt
DEV_SPLASH=/var/screens/cabo_boot_logo.png

# /var/sounds, transcribed from this firmware's rcS (lines 84-87). Identical to
# the Ultra's table: the source names do not match the destinations — boot.ogg
# becomes StartupVideo.ogg — so only the firmware's own list is right.
DEV_SOUNDS="StartupVideo.ogg    LF/Base/Qt/boot.ogg
ShutdownVideo.ogg   LF/Base/Qt/shutdown.ogg
TransitionVideo.ogg LF/Base/LpadAssets/Video/TransitionVideo.ogg
powerdown.wav       LF/Base/Qt/powerdown.wav"

DEV_UIPKG=PAD3-0x1F1E0002-100000                        # UNVERIFIED

# ---- audio ----------------------------------------------------------------
# Confirmed, not inferred: LF/Base/MfgTest/MfgTest_ReleaseNotes.txt in this
# very image quotes the device's own log line —
#     [0x1] Found codec: socaudiolfp100, legacy=0
DEV_CODEC=socaudiolfp100

# ---- firmware download ----------------------------------------------------
# THIS DEVICE HAS NO FIRMWARE DIRECTORY. Every LeapFrog device before it puts
# its firmware under a per-device name (PADFW, PAD3FW, GAMFW) that matches
# OpenLFConnect's LF_URL. The LeapPad3 does not appear in OpenLFConnect at all,
# and its firmware is served from the ORDINARY CONTENT LAYOUT — the middle
# field of the package ID, which is the first thing fetch-firmware.py tries:
#
#   packages/0x002A0001/PAD3-0x002A0001-000000.lfp   141,684,486  Firmware Base
#   packages/0x002A0003/PAD3-0x002A0003-000000.lfp     6,701,279  Surgeon
#   packages/0x002A0001/PAD3-0x002A0001-000002.lfp         3,855  Bulk Empty
#
# All three confirmed live. DEV_FW_DIR is left empty rather than guessed: it is
# only ever a fallback candidate, and a wrong value would send requests at keys
# that do not exist. PAD4FW, PAD3FW, CABOFW and PADFW were each tried once and
# each 404s.
DEV_FW_DIR=
DEV_FW_PKG=PAD3-0x002A0001-000000
DEV_PKGLIST=EnglishLeapPad3Explorer.xml

# ---- MTD partition table --------------------------------------------------
# MOSTLY FICTION, AND DELIBERATELY SO. This is an eMMC device: the root
# filesystem is ext4 on mmcblk0p3 and Bulk is a partition, so /proc/mtd on
# hardware lists only the NOR flash the bootstrap and manufacturing data live
# in. What actually reads this file is CMfgData::Init, which parses it for a
# partition named MfgData0 and opens /dev/mtd<N>; without that it fails to
# init and CMfgData::Read segfaults inside libc. rcS confirms mtd0 is the NOR
# bootstrap (`get-bootstrap-version2 /dev/mtd0`) and make_dev_nodes.sh makes
# exactly mtd0, mtd1 and mtd2 — so those three are real, and the sizes are
# carried over from the LeapPad2 because nothing reads them.
DEV_MTD="mtd0: 0007e000 00001000 \"NOR_Boot\"
mtd1: 00001000 00001000 \"MfgData0\"
mtd2: 00001000 00001000 \"MfgData1\""

# ---- capabilities ---------------------------------------------------------
# WiFi, and the same ConnMan-over-D-Bus stack as the Ultra: every Qt module
# here links libQtRioConnman.so.1, and rcS runs /etc/init.d/connman. Nothing
# shims it yet.
DEV_HAS_WIFI=1
DEV_HAS_QT=1

# ---- guest environment ----------------------------------------------------
# THIS IS NOT OPTIONAL DECORATION — WITHOUT IT THE SHELL SEGFAULTS.
#
# The device sets these in /etc/profile, with the comment "do it here (not
# rcS) so that user's command line gets it too". Tadpole execs the shell binary
# directly and never sources a profile, so Qt comes up with no QWS_DISPLAY,
# never opens /dev/fb0, and dies before reaching its screen driver.
# Transformed:Rot0 selects libqgfxtransformed.so — the only gfxdriver plugin in
# this image, as on the Ultra — wrapping LinuxFb with a rotation of zero.
#
# TOUCH. /etc/profile computes the node at boot:
#     QWS_MOUSE_PROTO=TsLib:$(list-input-devices | fgrep "touchscreen interface")
# We cannot run that (it enumerates /dev/input on hardware), so the name is
# written out. The shim answers to /dev/input/touchscreen0 and maps it to
# event2, the node whose EVIOCGNAME is "touchscreen interface".
#
# TsLib IS THE ONLY OPTION, and this was settled on the Ultra rather than
# guessed: libQtGuiE's strings list LinuxInput/intellimouse/mouseman/qvfbmouse,
# but the only mouse driver PLUGIN in the image is libqtslibmousedriver.so, so
# that list is a name table for handlers this build does not carry.
#
# TSLIB_CALIBFILE IS LOAD-BEARING IN A WAY ITS NAME HIDES. It is not only where
# tslib's `linear` module reads its transform: Qt's own driver checks whether
# this file EXISTS to decide which tslib entry point to call — ts_read (the
# filtered chain, calibration applied) when it does, ts_read_raw (straight
# evdev, no filters at all) when it does not. Both symbols are imported by
# libqtslibmousedriver.so. setup-sysroot.sh writes an identity pointercal here,
# so the filtered path is the one in use and the viewer's screen pixels pass
# through unchanged.
# PATH IS NOT DECORATION EITHER — WITHOUT IT NOTHING BUT THE HOME SCREEN RUNS.
#
# AppServer launches its own screens BY BARE NAME — 'BrioWrapper', 'SignIn',
# 'ParentPicker' — and resolves them through PATH. /LF/Base/Qt/bin holds a
# symlink for each. The device sets that up in /etc/profile; we exec the shell
# binary directly and never source one, so the guest inherited the HOST's PATH
# and QProcess could not find a single one of them.
#
# It presents as three unrelated faults, which is why it is worth naming:
#   * no app launches      — 'BrioWrapper' not found
#   * no sign-in screen    — 'SignIn' not found, so it goes straight to the
#                            home screen with whatever profile exists
#   * no parent settings   — 'ParentPicker' not found
# and the failure is reported as "Application: 'BrioWrapper' crashed,
# exit=0, error=0", which reads like the app dying rather than never starting.
# error=0 is QProcess::FailedToStart.
#
# MainPicker is the one that works, and only because DEV_FIRST_APP names it by
# absolute path on the command line — which is what hides the bug.
#
# Transcribed from /etc/profile, with $PATH expanded to the ordinary system
# directories it would have held at that point:
#     export PATH=/LF/Base/Brio/bin/:/LF/Base/bin/:/LF/Base/Qt/bin/:$PATH:/usr/local/bin
DEV_ENV="PATH=/LF/Base/Brio/bin:/LF/Base/bin:/LF/Base/Qt/bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
QWS_MOUSE_PROTO=TsLib:/dev/input/touchscreen0
TSLIB_TSDEVICE=/dev/input/touchscreen0
TSLIB_CONFFILE=/etc/ts.conf
TSLIB_PLUGINDIR=/usr/lib/ts
TSLIB_CALIBFILE=/flags/pointercal
QWS_DISPLAY=Transformed:Rot0
QWS_DATA_HOME=/LF/Bulk/Data/Local/All/qws/share
QWS_CACHE_HOME=/LF/Bulk/Data/Local/All/qws/cache/
TMPDIR=/LF/Bulk/Data/Local/All/qws
FUSE_THREAD_STACK=1048576"

# ---- how the system UI is stored ------------------------------------------
# The LeapPad2's panel is portrait, so AppManager draws its home screen a
# quarter turn from the way the tablet is held and the viewer turns it back.
# The Qt shell does not: MainPicker reports "isPortrait: false w: 480 h: 272"
# and draws landscape-native, upright. Turning it would put the picture on its
# side AND send every tap a quarter turn away from where it was aimed, which
# looks like broken touch rather than a rotated window.
DEV_UI_ROTATE=0
