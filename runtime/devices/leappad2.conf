# Tadpole device profile — LeapPad2 Explorer (VALENCIA)
#
# Every value here was previously hardcoded in setup-sysroot.sh and tadpole.sh.
# The ones under "sysfs" were read off a live device — see
# reference/device-capture/ — and are not guesses.

DEV_ID=leappad2
DEV_NAME="LeapPad2"
DEV_LONGNAME="LeapPad2 Explorer"

# Firmware/meta.inf Device= in the installed rootfs. This is what autodetect
# matches on, and it is also the PackageList device= attribute.
DEV_META_DEVICE=LeapPad2Explorer

# ---- sysfs identity -------------------------------------------------------
DEV_PLATFORM=VALENCIA
DEV_PLATFORM_FAMILY=LPAD
DEV_SYSTEM_REV=0x310
DEV_LCD=480x272
DEV_LCD_TYPE=ILI6480G2
DEV_LCD_MFG="K&D-1"

# The kernel names its platform devices after the SoC generation, and the
# LeapPad2 kernel is inconsistent about it: gpio and dpc kept the lf1000-
# prefix, power/aclmtr/touchscreen moved to lf2000-. Both are confirmed in
# the firmware's own rcS.
DEV_GPIO_DEV=lf1000-gpio
DEV_DPC_DEV=lf1000-dpc
DEV_POWER_DEV=lf2000-power
DEV_ACLMTR_DEV=lf2000-aclmtr
DEV_TOUCH_DEV=lf2000-touchscreen

# ---- shell ----------------------------------------------------------------
# What /usr/bin/app launches. The Brio-era devices run AppManager directly.
DEV_SHELL=/LF/Base/bin/AppManager
DEV_SHELL_ARGS=""
DEV_ASSETS=LpadAssets
DEV_SPLASH=/var/screens/Valencia-Boot-logoCW.png

# /var/sounds, exactly as rcS builds it for PLATFORM=VALENCIA.
# Format: "<name under /var/sounds> <source path under the rootfs>".
DEV_SOUNDS="StartupVideo.ogg    LF/Base/LpadAssets/Video/StartupVideo.ogg
ShutdownVideo.ogg   LF/Base/LpadAssets/Video/ShutdownVideo.ogg
TransitionVideo.ogg LF/Base/LpadAssets/Video/TransitionVideo.ogg
powerdown.wav       LF/Base/LpadAssets/Video/powerdown.wav"

# Per-profile UI state package under LF/Bulk/Data/Local/<n>/.
DEV_UIPKG=PAD2-0x1F1E0002-100000

# ---- audio ----------------------------------------------------------------
# /proc/asound/card0/id — CAudioModule logs "Found codec: %s".
DEV_CODEC=socaudiolfp100

# ---- firmware download ----------------------------------------------------
# See tools/fetch-firmware.py. The CDN lays firmware out under a per-device
# directory, which is OpenLFConnect's LF_URL for the same device.
DEV_FW_DIR=PADFW
DEV_FW_PKG=PAD2-0x00220004-000000
DEV_PKGLIST=EnglishLeapPad2.xml

# ---- MTD partition table --------------------------------------------------
# CMfgData::Init parses /proc/mtd for MfgData0 and then opens /dev/mtd<N>.
DEV_MTD="mtd0: 0007e000 00001000 \"NOR_Boot\"
mtd1: 00001000 00001000 \"MfgData0\"
mtd2: 00001000 00001000 \"MfgData1\"
mtd3: 00400000 00100000 \"Reserved\"
mtd4: 01000000 00100000 \"Kernel\"
mtd5: 0a000000 00100000 \"RFS\"
mtd6: f4c00000 00100000 \"Bulk\""

# ---- how the system UI is stored ------------------------------------------
# A quarter turn. The panel is portrait, so everything AppManager draws — the
# home screen and the boot logo alike — is stored sideways from the way the
# tablet is held; "Valencia-Boot-logoCW.png" says so in its own name. This is
# the value the viewer used unconditionally before it was a per-device fact.
DEV_UI_ROTATE=270
