# Tadpole device profile — Leapster GS Explorer (LUCY)
#
# A DRAFT, AND THE UNVERIFIED MARKS BELOW ARE HONEST. Everything here comes
# from the survey in docs/LEAPSTER-GS.md, which was written against the real
# firmware pulled from the CDN; the fields marked UNVERIFIED are LeapPad2
# carryovers that nothing in the image confirmed. They are left visible rather
# than quietly dropped, because a profile that looks complete is worse than one
# that says where it is guessing.
#
# THE GS IS A LEAPPAD2 WITH A SMALLER SCREEN, which is what makes it cheap to
# add. /usr/bin/app, AppManager and VideoDaemon are BYTE-IDENTICAL to the
# LeapPad2's, as are 30 of 31 Brio libraries and the entire OpenGL ES stack —
# the same libGLESv1_CM the shim was hardened against. No Qt, no ConnMan, no
# wifi, so all three of the LeapPad3's blockers are structurally absent here.

DEV_ID=leapstergs
DEV_NAME="Leapster GS"
DEV_LONGNAME="LeapFrog Leapster GS Explorer"

# Firmware-Base/meta.inf and the rootfs's own Firmware/meta.inf both say this,
# and tad_detect_device() matches on it.
DEV_META_DEVICE=LeapsterGSExplorer

# LOAD-BEARING. libUtility's GetPlatformName() reads
# /sys/devices/system/board/platform and the Lightning shell picks LUCY/main.swf
# and LucyAssets from the answer — libLightningBase carries all three devices'
# paths and chooses at runtime.
DEV_PLATFORM=LUCY
DEV_PLATFORM_FAMILY=LEX          # rcS's LEX branch selects Lucy-Boot-logo.png
DEV_SYSTEM_REV=0x310             # UNVERIFIED — copied from the LeapPad2

# Every one of the 19 boot assets is 320x240, and no CW variant exists. The
# LeapPad2 ships each asset twice because its panel is portrait and the stored
# image is a quarter turn from how it is held; the GS ships one, landscape.
DEV_LCD=320x240
DEV_LCD_TYPE=UNKNOWN             # UNVERIFIED — nothing in the image names it
DEV_LCD_MFG="K&D-1"              # UNVERIFIED — copied from the LeapPad2

# LF1000 silicon. setcal uses lf2000-touchscreen and libLightningBase reads
# /sys/devices/platform/lf1000-gpio/power — the same split the LeapPad2 profile
# already encodes, so this block copies across unchanged.
DEV_GPIO_DEV=lf1000-gpio
DEV_DPC_DEV=lf1000-dpc
DEV_POWER_DEV=lf2000-power
DEV_ACLMTR_DEV=lf2000-aclmtr
DEV_TOUCH_DEV=lf2000-touchscreen

DEV_SHELL=/LF/Base/bin/AppManager   # byte-identical to the LeapPad2's
DEV_SHELL_ARGS=""
DEV_FIRST_APP=                      # AppManager takes none, as on the LeapPad2
DEV_ASSETS=LucyAssets
DEV_SPLASH=/var/screens/Lucy-Boot-logo.png

# rcS's PLATFORM==LUCY branch, transcribed. All four targets exist in the image
# — checked — which the SHIPPED /var/sounds symlinks do not: they point at
# LPTx_SplashAnimation.ogg, shutdown.ogg, TransitionAnimation.ogg and
# LF/Base/L3B_Video/splash.wav, none of which are in the rootfs. rcS repoints
# them at boot and we never run rcS, so this table is the whole fix.
DEV_SOUNDS="StartupVideo.ogg    LF/Base/LucyAssets/Video/StartupVideo.ogg
ShutdownVideo.ogg   LF/Base/LucyAssets/Video/ShutdownVideo.ogg
TransitionVideo.ogg LF/Base/LucyAssets/Video/TransitionVideo.ogg
powerdown.wav       LF/Base/LucyAssets/Video/powerdown.wav"

# NOT a guess — derived exactly as the LeapPad2's was, from the PackageID in
# the shell directory's own manifest:
#   LP2  LF/Base/LPAD/meta.inf  PackageID="PAD2-0x1F1E0002-100000"
#   GS   LF/Base/LUCY/meta.inf  PackageID="GAM2-0x00210008-100000"
DEV_UIPKG=GAM2-0x00210008-100000

DEV_CODEC=socaudiolfp100            # the device's own MfgTest release notes

# All 50 packages in this list were HEAD-checked live: none missing, 179.5 MB
# total. The firmware base is 34,215,420 bytes. Three vendor variants differ
# only in NAND geometry — Micron here, -001000 Samsung, -002000 Hynix — and the
# volume name C2G-E1M-W4K matches the manifest's eraseSize/writeSize exactly.
DEV_FW_DIR=GAMFW
DEV_FW_PKG=GAM2-0x00210004-000000
DEV_PKGLIST=EnglishLeapsterGSExplorer.xml

# UNVERIFIED. Only CMfgData::Init reads this, and only for MfgData0, so a
# three-line table is probably enough. The GS has 2 GB of NAND against the
# LeapPad2's 4 GB, so the LeapPad2's Bulk and RFS sizes would be wrong here
# even though nothing reads them.
DEV_MTD="mtd0: 0007e000 00001000 \"NOR_Boot\"
mtd1: 00001000 00001000 \"MfgData0\"
mtd2: 00001000 00001000 \"MfgData1\""

DEV_HAS_WIFI=0     # measured: no wireless driver, no wpa_supplicant, no ConnMan
DEV_HAS_QT=0       # measured: no LF/Base/Qt, no libQtGui anywhere

# /etc/profile is byte-identical to the LeapPad2's and sets nothing the guest
# needs, so there is nothing to carry. Note there is no TADPOLE_NO_TSLIB here
# and there should not be: that exists to stop a Qt shell and a Brio title
# fighting over tslib, and with DEV_HAS_QT=0 tadpole.sh sabotages TSLIB_CONFFILE
# for the whole run anyway, exactly as it does on the LeapPad2.
DEV_ENV=""

DEV_UI_ROTATE=0    # landscape-native; no CW asset exists
