# Tadpole device profile — LeapTV (GLASGOW)
#
# Firmware 7.0.1.2634, built 10/07/2014, out of the "DONUT" recovery image
# (archive.org/details/leaptv-donut): the payload the surgeon writes to the
# eMMC, as three GNU tars — RFS (the root), BULK (/LF/Bulk, titles included)
# and FAT32 (the kernel). tools/install-leaptv-donut.sh lays it out.
#
# A PROOF OF CONCEPT. Enough to boot AppServer and see the GLES2 shell draw;
# the controller, the camera and the wand pointer are not emulated. What is
# known and what is guessed is marked as on every other profile here.
#
# THE SAME MACHINE AS THE LEAPPAD3 IN EVERYTHING BUT THE BOX: LF3000/NXP4330,
# uClibc 0.9.33.1, AppServer/Qt 4.8.4 QWS launched `-qws`, Brio, Mali. Two
# things are genuinely different. It has no touchscreen and no buttons — a
# Bluetooth controller and a USB camera instead — and its whole system UI is a
# GLES2 program (GlasgowUI, OutOfBox, ParentSettings, VideoWidget, ErrorWidget
# all import glCreateShader/glUseProgram), which is what shim/tadpole_gles2.c
# exists for.

DEV_ID=leaptv
DEV_NAME="LeapTV"
DEV_LONGNAME="LeapFrog LeapTV"

# Firmware/meta.inf says Device="LeapTV". VERIFIED.
DEV_META_DEVICE=LeapTV

# ---- sysfs identity -------------------------------------------------------
# GLASGOW: the kernel's own "plat: register Glasgow power monitor", the board
# marking, and every asset name. platform_family is a guess nothing reads.
DEV_PLATFORM=GLASGOW
DEV_PLATFORM_FAMILY=GLASGOW                             # UNVERIFIED
DEV_SYSTEM_REV=0x320                                    # UNVERIFIED
# 1280x720. boot_logo.png is 1280 wide, the kernel carries the mode string
# "1280x720", and /usr/bin/app pans fb0 to line 1440 — two pages of 720.
DEV_LCD=1280x720
DEV_LCD_TYPE=HDMI                                       # UNVERIFIED
DEV_LCD_MFG=""

# The Brio libraries on this image still name the LF2000 nodes (both
# lf1000-power and lf2000-power appear in their strings); /usr/bin/app is the
# one thing that reads glasgow-power, and we never run it.
DEV_GPIO_DEV=lf1000-gpio
DEV_DPC_DEV=lf1000-dpc
DEV_POWER_DEV=lf2000-power
DEV_ACLMTR_DEV=lf2000-aclmtr
DEV_TOUCH_DEV=lf2000-touchscreen

# ---- shell ----------------------------------------------------------------
# /usr/bin/app: `$AppServer $appPath $2 -qws` with appPath from $RIO_FIRST_APP,
# which nothing sets — so on the device it is plain `AppServer -qws`, and
# AppServer's own BaseAppPaths.json decides what comes up:
#     "InitialSetup": "/LF/Base/OutOfBox/OutOfBox",
#     "SignIn":       "/LF/Base/GlasgowUI/GlasgowUI"
# With /flags/skip_oobe (setup-sysroot.sh writes it) that is GlasgowUI.
DEV_SHELL=/LF/Base/Qt/Modules/AppServer/AppServer
DEV_SHELL_ARGS="-qws"
DEV_FIRST_APP=
DEV_ASSETS=Qt
DEV_SPLASH=/var/screens/boot_logo.png

# rcS on this device plays /var/sounds/startup_glasgow.wav and StartupVideo.ogg
# and builds no symlink table, so this is the Ultra's, which the same files in
# LF/Base/Qt satisfy. Missing ones are noted, not fatal.
DEV_SOUNDS="StartupVideo.ogg    LF/Base/Qt/boot.ogg
ShutdownVideo.ogg   LF/Base/Qt/shutdown.ogg
powerdown.wav       LF/Base/Qt/powerdown.wav"

# GlasgowUI's own PackageID, from LF/Base/GlasgowUI/meta.inf.
DEV_UIPKG=THDS-0x00310027-000000

# ---- audio ----------------------------------------------------------------
# /etc/init.d/alsa probes for an LFP100 or a Cirrus CS43L22; the LFP100 is the
# LeapFrog part every sibling device has.
DEV_CODEC=socaudiolfp100                                # UNVERIFIED

# ---- firmware download ----------------------------------------------------
# The CDN serves packages/0x00300001/THD1-0x00300001-000141.lf2 — the newest
# marker in this image's Firmware/ directory — so a retail firmware exists
# online. No package list has been transcribed for it; the DONUT image is the
# supported way in for now.
DEV_FW_DIR=
DEV_FW_PKG=THD1-0x00300001-000141
DEV_PKGLIST=

# ---- MTD partition table --------------------------------------------------
# Same fiction as the LeapPad3's, for the same reader (CMfgData::Init).
DEV_MTD="mtd0: 0007e000 00001000 \"NOR_Boot\"
mtd1: 00001000 00001000 \"MfgData0\"
mtd2: 00001000 00001000 \"MfgData1\""

# ---- capabilities ---------------------------------------------------------
DEV_HAS_WIFI=1
DEV_HAS_QT=1

# ---- guest environment ----------------------------------------------------
# Transcribed from this image's /etc/profile, which is the LeapPad3's with two
# Phonon lines added. TADPOLE_WAND is ours: it makes shim/tadpole_wand.c stand
# in for the controller, with the viewer's mouse as the wand. There is no touchscreen here; the shim's fake
# "touchscreen interface" is what lets the mouse act as one on the Qt side,
# which is the only pointing device this proof of concept has.
DEV_ENV="PATH=/LF/Base/Brio/bin:/LF/Base/bin:/LF/Base/Qt/bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
QWS_MOUSE_PROTO=TsLib:/dev/input/touchscreen0
TSLIB_TSDEVICE=/dev/input/touchscreen0
TSLIB_CONFFILE=/etc/ts.conf
TSLIB_PLUGINDIR=/usr/lib/ts
TSLIB_CALIBFILE=/flags/pointercal
QWS_DISPLAY=Transformed:Rot0
QWS_DATA_HOME=/LF/Bulk/Data/Local/All/qws/share
QWS_CACHE_HOME=/LF/Bulk/Data/Local/All/qws/cache/
TMPDIR=/LF/Bulk/Data/Local/All/qws
FUSE_THREAD_STACK=1048576
PHONON_GST_VIDEOMODE=YUV
PHONON_GST_ROTATE=1
TADPOLE_NO_TSLIB=BrioWrapper
TADPOLE_WAND=1"

# ---- engine ---------------------------------------------------------------
# qemu, for the same reason the Didj names one. AppServer is a QWS server and
# the first thing it does is take its display lock, a SysV semaphore:
#     QLock::QLock: Cannot create semaphore /tmp/qtembedded-0/QtEmbedded-0
#     'd' (38, Function not implemented)  ...  FATAL: Cannot get display lock
# Glasspole reports ARM syscalls 299 and 300 — semget and semctl — as
# unimplemented, and the shell aborts one second in. qemu-arm has them.
# TADPOLE_QEMU still overrides for whoever adds them to Glasspole.
DEV_ENGINE=qemu

# A television draws upright.
DEV_UI_ROTATE=0
