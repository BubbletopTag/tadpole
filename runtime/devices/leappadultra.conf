# Tadpole device profile — LeapPad Ultra (RIO)
#
# Firmware 5.2.7.1002, built 12/16/2013.
#
# The Ultra is NOT a bigger LeapPad2. Underneath it is close enough to share
# almost everything Tadpole does — same ARMv7/VFPv2 ABI, same uClibc family,
# same libvr5 GL stack, same lf2000-* kernel drivers, same .lfp package
# format, same fb/evdev/sysfs interfaces — but its SHELL is a different
# program. LeapPad2 boots AppManager (Brio + Flash Lite). The Ultra boots
# AppServer, a Qt 4.8.4 embedded (QWS) application, and keeps AppManager
# around as AppManager.legacy purely to run cartridge titles.
#
# Values marked UNVERIFIED were inferred from the firmware rather than read off
# hardware. See docs/ULTRA.md for how each was derived.

DEV_ID=leappadultra
DEV_NAME="LeapPad Ultra"
DEV_LONGNAME="LeapPad Ultra"

DEV_META_DEVICE=LeapPadUltra

# ---- sysfs identity -------------------------------------------------------
# rcS branches on both, and for this device tests both against "RIO":
#     PFAMILY=$(cat platform_family);  [ "$PFAMILY" = "RIO" ]
#     PLATFORM=$(cat platform);        [ "$PLATFORM" == "RIO" ]
DEV_PLATFORM=RIO
DEV_PLATFORM_FAMILY=RIO
DEV_SYSTEM_REV=0x310                                    # UNVERIFIED
# 1024x600, from the firmware itself: /var/screens/rio-sparkle-pngs/*.png are
# full-screen frames and measure 1024x600, and the Qt shell's QML declares
# width: 1024 / height: 600.
DEV_LCD=1024x600
DEV_LCD_TYPE=UNKNOWN                                    # UNVERIFIED
DEV_LCD_MFG="UNKNOWN"                                   # UNVERIFIED

# rcS on this firmware still writes lf2000-aclmtr and reads
# lf2000-touchscreen/firmware_version, so the driver names did not move.
DEV_GPIO_DEV=lf1000-gpio
DEV_DPC_DEV=lf1000-dpc
DEV_POWER_DEV=lf2000-power
DEV_ACLMTR_DEV=lf2000-aclmtr
DEV_TOUCH_DEV=lf2000-touchscreen

# ---- shell ----------------------------------------------------------------
# /usr/bin/app on this firmware runs:
#     nice -n $niceLevel AppServer $appPath $2 -qws
# -qws makes this process the Qt Window System SERVER, which is what puts Qt
# in charge of /dev/fb0 directly rather than talking to X. That is why the
# existing framebuffer shim is the right substrate for it.
#
# THE MODULE PATH, NOT /LF/Base/Qt/bin/AppServer. That name exists, but it is
# a symlink whose target is the ABSOLUTE GUEST PATH
# /LF/Base/Qt/Modules/AppServer/AppServer — correct on the device, and
# unresolvable on the host, where tadpole.sh has to hand qemu a real file.
# Following it produced no error at all: the shell simply never started.
# (Same trap as usr/lib/libustring.so; see docs/ULTRA.md.)
DEV_SHELL=/LF/Base/Qt/Modules/AppServer/AppServer
DEV_SHELL_ARGS="-qws"
# The first QML app AppServer loads; /usr/bin/app reads it from $RIO_FIRST_APP.
DEV_FIRST_APP=/LF/Base/Qt/Modules/MainPicker/MainPicker
DEV_ASSETS=Qt
DEV_SPLASH=/var/screens/Valencia-Boot-logoCW.png        # no rio_1024x600.png in RFS

# /var/sounds, exactly as rcS builds it for PLATFORM=RIO. Note that the source
# names do NOT match the destinations here — boot.ogg becomes StartupVideo.ogg
# — and that TransitionVideo.ogg is the one file still taken from LpadAssets.
DEV_SOUNDS="StartupVideo.ogg    LF/Base/Qt/boot.ogg
ShutdownVideo.ogg   LF/Base/Qt/shutdown.ogg
TransitionVideo.ogg LF/Base/LpadAssets/Video/TransitionVideo.ogg
powerdown.wav       LF/Base/Qt/powerdown.wav"

DEV_UIPKG=PHR1-0x1F1E0002-100000                        # UNVERIFIED

# ---- audio ----------------------------------------------------------------
DEV_CODEC=socaudiolfp100                                # UNVERIFIED

# ---- firmware download ----------------------------------------------------
# Confirmed live against the CDN:
#   packages/PAD3FW/PHR1-0x00280005-000000.lfp   114,786,635 bytes  Firmware Base
#   packages/PAD3FW/PHR1-0x00270003-000000.lfp     5,935,943 bytes  Surgeon
#   packages/PAD3FW/PHR1-0x00280005-000002.lfp        34,385 bytes  Bulk Empty
DEV_FW_DIR=PAD3FW
DEV_FW_PKG=PHR1-0x00280005-000000
DEV_PKGLIST=EnglishLeapPadUltra.xml

# ---- MTD partition table --------------------------------------------------
# UNVERIFIED. Same shape as the LeapPad2 table with a larger Bulk to match the
# Ultra's 8 GB NAND. Only MfgData0's presence and index actually matter to
# CMfgData::Init; the sizes are cosmetic until something reads them.
DEV_MTD="mtd0: 0007e000 00001000 \"NOR_Boot\"
mtd1: 00001000 00001000 \"MfgData0\"
mtd2: 00001000 00001000 \"MfgData1\"
mtd3: 00400000 00100000 \"Reserved\"
mtd4: 01000000 00100000 \"Kernel\"
mtd5: 0a000000 00100000 \"RFS\"
mtd6: f4c00000 00100000 \"Bulk\""

# ---- Ultra-only -----------------------------------------------------------
# The Ultra has WiFi. libWirelessMPI.so is the one Brio library it has that
# the LeapPad2 does not, and the Qt shell links libQtRioConnman.so.1 — so the
# network stack is ConnMan over D-Bus. Nothing here shims it yet; see
# docs/ULTRA.md.
DEV_HAS_WIFI=1
DEV_HAS_QT=1

# ---- guest environment ----------------------------------------------------
# THIS IS NOT OPTIONAL DECORATION — WITHOUT IT THE SHELL SEGFAULTS.
#
# The device sets these in /etc/profile, with the comment "do it here (not
# rcS) so that user's command line gets it too". Tadpole execs the shell
# binary directly and never sources a profile, so Qt came up with no
# QWS_DISPLAY at all, never opened /dev/fb0, and died before reaching its
# screen driver. Transformed:Rot0 selects the gfxdriver plugin that actually
# ships here — usr/lib/qtopia/plugins/gfxdrivers/libqgfxtransformed.so is the
# only one in the image — wrapping LinuxFb with a rotation of zero.
#
# Format: one NAME=VALUE per line.
#
# TOUCH: TsLib, AND IT HAD TO BE.
#
# LinuxInput was tried first and looks like the better answer — libQtGuiE's
# strings list linuxinput, intellimouse, mouseman and qvfbmouse, and reading
# evdev directly would skip tslib entirely. It does not work: with
# QWS_MOUSE_PROTO=LinuxInput:/dev/input/event2 correctly in the environment
# (verified in the running qemu's argv) Qt never opened ANY event node. The
# only mouse driver PLUGIN in the image is libqtslibmousedriver.so, so those
# strings are a name table for handlers this build does not carry.
#
# So: tslib, as the device does it. The reason it used to crash on the first
# tap is not tslib being broken — it is that /etc/profile points it at
# /dev/input/touchscreen0, a node udev makes on hardware and nothing made
# here. module_raw input opened nothing, the chain came up with a null
# ops->read, and the first touch jumped through it. The shim now maps that
# name to event2 (see ev_index), and the four TSLIB_ variables below are the
# device's own, with the calibration pointed at the identity pointercal
# setup-sysroot.sh already writes — the viewer sends screen pixels, so
# identity is what we want.
DEV_ENV="QWS_MOUSE_PROTO=TsLib:/dev/input/touchscreen0
TSLIB_TSDEVICE=/dev/input/touchscreen0
TSLIB_CONFFILE=/etc/ts.conf
TSLIB_PLUGINDIR=/usr/lib/ts
TSLIB_CALIBFILE=/flags/pointercal
QWS_DISPLAY=Transformed:Rot0
QWS_DATA_HOME=/LF/Bulk/Data/Local/All/qws/share
QWS_CACHE_HOME=/LF/Bulk/Data/Local/All/qws/cache/
TMPDIR=/LF/Bulk/Data/Local/All/qws
FUSE_THREAD_STACK=1048576"

# ---- how the system UI is stored ------------------------------------------
# Landscape-native and upright, like the LeapPad3 and unlike the LeapPad2 —
# same Qt shell. See the note in leappad3.conf.
DEV_UI_ROTATE=0
