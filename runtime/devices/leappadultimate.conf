# Tadpole device profile — LeapPad Ultimate (SANTIAGO)
#
# Firmware 9.1.0.252, built 09/29/2021 — the last firmware LeapFrog built for
# any LeapPad, five years after the LeapPad3's. Fetched from the CDN under the
# ordinary content layout, exactly as the LeapPad3's is (see DEV_FW_DIR).
#
# THE LEAPPAD3 AT THE ULTRA'S SIZE. Same LF3000/NXP4330 board family (the
# kernel is "Linux version 3.4.39 ... nxp4330-santiago"), same uClibc
# 0.9.33.1-git loader byte for byte, same AppServer/Qt 4.8.4 QWS shell
# launched `-qws`, same Mali GL stack (a different build of the same
# 1,479,456-byte blob), same package-manager daemon over D-Bus, the same
# /etc/profile give or take a PATH entry — on the Ultra's 1024x600 panel.
# /usr/bin/app pans fb0 to line 1200 (two pages of 600) where the LeapPad3's
# pans to 544. Every Qt module in LF/Base/Qt/Modules imports GLES 1 only: no
# glCreateShader anywhere, so this is the LeapPad3's HLE path, not the LeapTV's.
#
# Values marked UNVERIFIED were inferred from the firmware rather than read off
# hardware. See docs/ULTIMATE.md for how each was derived.

DEV_ID=leappadultimate
DEV_NAME="LeapPad Ultimate"
DEV_LONGNAME="LeapFrog LeapPad Ultimate"

# Firmware/meta.inf says Device="LeapPadUltimate", and so does the package
# list (<PackageList device="LeapPadUltimate">). VERIFIED.
DEV_META_DEVICE=LeapPadUltimate

# ---- sysfs identity -------------------------------------------------------
# SANTIAGO: the kernel's own uImage name ("Angstrom/3.4.39+git/santiago"), its
# "SANTIAGO GPIO mapping" banner, /etc/init.d/touchscreen-santiago, and
# /var/screens/santiago_boot_battery_low_1024_600.png. usr/bin/recovery-dftp
# branches on it in the same if-chain as RIO, CABO, XANADU, BOGOTA and GLASGOW.
# rcS only logs `platform`; nothing branches on platform_family.
DEV_PLATFORM=SANTIAGO
DEV_PLATFORM_FAMILY=SANTIAGO                            # UNVERIFIED
DEV_SYSTEM_REV=0x320                                    # UNVERIFIED
# 1024x600: every full-screen asset in /var/screens measures it, two of them
# say so in their own names (boot_logo_1024_600.png, the battery-low card),
# the kernel carries the mode string "1024x600", and rcS's battery check
# draws the 1024_600 card.
DEV_LCD=1024x600
DEV_LCD_TYPE=UNKNOWN                                    # UNVERIFIED
# NOT read by anything on this device: touchscreen-santiago probes i2c bus 2
# for a Chipone (K&D) or an Ilitek (GP) controller instead of consulting
# lcd_mfg. Kept because setup-sysroot.sh writes the file for every device.
DEV_LCD_MFG="K&D-1"                                     # UNVERIFIED

# rcS still reads lf2000-power/voltage and writes lf2000-aclmtr/calibration
# on this board, the same names as three generations back.
DEV_GPIO_DEV=lf1000-gpio
DEV_DPC_DEV=lf1000-dpc
DEV_POWER_DEV=lf2000-power
DEV_ACLMTR_DEV=lf2000-aclmtr
DEV_TOUCH_DEV=lf2000-touchscreen

# ---- shell ----------------------------------------------------------------
# /usr/bin/app: `nice -n $niceLevel AppServer $appPath $2 -qws`, appPath from
# $RIO_FIRST_APP, which nothing in this firmware sets. Same module-path trap
# as the LeapPad3: /LF/Base/Qt/bin/AppServer is a symlink to the absolute
# guest path, unresolvable on the host.
DEV_SHELL=/LF/Base/Qt/Modules/AppServer/AppServer
DEV_SHELL_ARGS="-qws"
# Empty, as on the LeapPad3: AppServer's BaseAppPaths.json is the same
# placeholder ("this empty one will work for Cabo, Xanadu, Bogota ...") and
# libQtAppServer picks the first screen itself.
DEV_FIRST_APP=
DEV_ASSETS=Qt
DEV_SPLASH=/var/screens/boot_logo_1024_600.png

# /var/sounds, transcribed from this firmware's rcS (lines 116-119). The
# LeapPad3's table, byte for byte.
DEV_SOUNDS="StartupVideo.ogg    LF/Base/Qt/boot.ogg
ShutdownVideo.ogg   LF/Base/Qt/shutdown.ogg
TransitionVideo.ogg LF/Base/LpadAssets/Video/TransitionVideo.ogg
powerdown.wav       LF/Base/Qt/powerdown.wav"

# LF/Base/Qt/meta.inf in this image. VERIFIED.
DEV_UIPKG=PHR3-0x00270008-100000

# ---- audio ----------------------------------------------------------------
# /etc/init.d/alsa probes for an LFP100 or a Cirrus CS43L22, as on every
# sibling; the LFP100 is the LeapFrog part.
DEV_CODEC=socaudiolfp100                                # UNVERIFIED

# ---- firmware download ----------------------------------------------------
# NO FIRMWARE DIRECTORY, like the LeapPad3: served from the ordinary content
# layout under the ID's middle field. Confirmed live 2026-09-20:
#
#   packages/0x00430001/PHR3-0x00430001-000000.lfp   156,894,035  Firmware Base
#   packages/0x00430003/PHR3-0x00430003-000000.lfp     7,110,410  Surgeon
#   packages/0x00430001/PHR3-0x00430001-000002.lfp         4,598  Bulk Empty
#
# The base package is the LeapPad3's shape: firmware/emmc/2ext4/3/RFS, a plain
# GNU tar of the root (312 MB), plus firmware/emmc/1fat/2/FAT32 holding the
# uImage. Extracts to rootfs/leappadultimate-<version>/emmc_rfs.
DEV_FW_DIR=
DEV_FW_PKG=PHR3-0x00430001-000000
DEV_PKGLIST=EnglishLeapPadUltimate.xml

# ---- MTD partition table --------------------------------------------------
# Same fiction as the LeapPad3's, for the same reader (CMfgData::Init wants a
# partition named MfgData0). eMMC device; only NOR is really MTD.
DEV_MTD="mtd0: 0007e000 00001000 \"NOR_Boot\"
mtd1: 00001000 00001000 \"MfgData0\"
mtd2: 00001000 00001000 \"MfgData1\""

# ---- capabilities ---------------------------------------------------------
# WiFi over ConnMan/D-Bus (rcS adds a connman user and installs its D-Bus
# policy; every Qt module links libQtRioConnman.so.1). Nothing shims it yet.
DEV_HAS_WIFI=1
DEV_HAS_QT=1

# ---- guest environment ----------------------------------------------------
# Transcribed from this image's /etc/profile, which is the LeapPad3's with
# one more PATH entry (a DeviceTools directory inside a title that is not
# installed; harmless). Everything the LeapPad3's profile says about
# QWS_DISPLAY, TsLib, TSLIB_CALIBFILE, PATH and TADPOLE_NO_TSLIB applies
# here unchanged — same Qt build, same single mouse-driver plugin, same
# BrioWrapper. See runtime/devices/leappad3.conf for the reasoning.
DEV_ENV="PATH=/LF/Base/Brio/bin:/LF/Base/bin:/LF/Base/Qt/bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/LF/Bulk/ProgramFiles/LPAD-0x001C0004-1835012/DeviceTools
QWS_MOUSE_PROTO=TsLib:/dev/input/touchscreen0
TSLIB_TSDEVICE=/dev/input/touchscreen0
TSLIB_CONFFILE=/etc/ts.conf
TSLIB_PLUGINDIR=/usr/lib/ts
TSLIB_CALIBFILE=/flags/pointercal
QWS_DISPLAY=Transformed:Rot0
QWS_DATA_HOME=/LF/Bulk/Data/Local/All/qws/share
QWS_CACHE_HOME=/LF/Bulk/Data/Local/All/qws/cache/
TMPDIR=/LF/Bulk/Data/Local/All/qws
FUSE_THREAD_STACK=1048576
TADPOLE_NO_TSLIB=BrioWrapper"

# ---- engine ---------------------------------------------------------------
# qemu, for the LeapTV's reason: AppServer is a QWS server and the first thing
# it does is take its display lock, a SysV semaphore —
#     QLock::QLock: Cannot create semaphore ... FATAL: Cannot get display lock
# — and Glasspole reports ARM syscalls 299 and 300 (semget, semctl) as
# unimplemented. Measured on this firmware's first boot, one second in.
# TADPOLE_QEMU still overrides for whoever adds them to Glasspole.
DEV_ENGINE=qemu

# ---- how the system UI is stored ------------------------------------------
# Landscape-native and upright, like the Ultra and the LeapPad3: the same Qt
# shell, drawn the way the tablet is held.
DEV_UI_ROTATE=0
